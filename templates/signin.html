<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fafc;
    font-family: Inter, sans-serif;
}

.auth-container {
    width: 100%;
    max-width: 420px;
    padding: 24px;
}

.auth-card {
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.auth-title {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
}

.auth-subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 32px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe2ea;
    border-radius: 10px;
    font-size: 15px;
}

.form-group input:focus {
    outline: none;
    border-color: #111827;
}

.signin-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

.signin-btn:hover {
    opacity: 0.95;
}

.divider {
    text-align: center;
    margin: 24px 0;
    color: #94a3b8;
    position: relative;
}

.divider::before,
.divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: #e2e8f0;
}

.divider::before {
    left: 0;
}

.divider::after {
    right: 0;
}

.google-btn {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe2ea;
    border-radius: 10px;
    background: white;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.google-btn:hover {
    background: #f8fafc;
}

.auth-footer {
    margin-top: 24px;
    text-align: center;
}

.auth-footer a {
    color: #111827;
    text-decoration: none;
    font-weight: 600;
}

.forgot-password {
    display: block;
    text-align: right;
    margin-top: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #64748b;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
            Sign in to your account
        </p>

        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <a href="#" class="forgot-password">
                Forgot Password?
            </a>

            <button type="submit" class="signin-btn">
                Sign In
            </button>
        </form>

        <div class="divider">
            OR
        </div>

        <button class="google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107"
                    d="M43.611 20.083H42V20H24v8h11.303C33.655 32.657 29.2 36 24 36c-6.627 0-12-5.373-12-12S17.373 12 24 12c3.059 0 5.842 1.154 7.96 3.04l5.657-5.657C34.046 6.053 29.27 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00"
                    d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.96 3.04l5.657-5.657C34.046 6.053 29.27 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50"
                    d="M24 44c5.169 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.145 35.091 26.715 36 24 36c-5.18 0-9.624-3.329-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2"
                    d="M43.611 20.083H42V20H24v8h11.303a12.05 12.05 0 0 1-4.084 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>

            Sign in with Google
        </button>

        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>

    </div>
</div>

</body>

<script>
    async function login(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Login successful!');
            
            // Example redirect
            window.location.href = "{{ url_for('leads_management_bp.lead' )}}";
        } else {
            alert(data.message || 'Invalid email or password');
        }

    } catch (error) {
        console.error('Error during login:', error);
        alert('An error occurred during login. Please try again.');
    }
}
</script>
</html>
